name: Run Tests and Build

on: [push, pull_request]

concurrency:
  # make sure only one run of this workflow for a given PR or a given branch
  # can happen at one time. previous queued or started runs will be cancelled.
  # github.workflow is the workflow name
  # github.ref is the ref that triggered the workflow run
  # on push, this is refs/heads/<branch name>
  # on pull request, this is refs/pull/<pull request number>/merge
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-binaries:
    name: Build binaries
    runs-on: windows-latest
    steps:

      # - name: Setup conda environment
      #   uses: mamba-org/setup-micromamba@v2
      #   with:
      #     init-shell: bash

      - shell: bash
        run: |
          curl -O https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64
          ls
          ./micromamba-win-64 --version
          ./micromamba-win-64 create --yes --name test_env -c conda-forge python pip
          ./micromamba-win-64 run --name test_env python -m pip --version
          ./micromamba-win-64 run --name test_env pip --version

