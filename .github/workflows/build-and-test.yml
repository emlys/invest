name: Run Test

on: [push, pull_request]

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}
      volumes:
        - /home/runner:/runner
    strategy:
      fail-fast: false
      matrix:
        container: [quay.io/pypa/manylinux_2_28_x86_64, 'amd64/almalinux:9', 'ubuntu:latest', '']
    steps:
      - name: test
        run: |
          pwd
          ls

          cd /runner
          ls

          touch foo
          ls -l foo
          chmod +x foo
          ls -l foo
          ./foo

          chmod 0444 foo
          ls -l foo
          ./foo

          mkdir bar
          ls -ld bar
          chmod 0444 bar
          ls -ld bar
          cd bar
